# Konfigurasi Nginx Reverse Proxy untuk Qrispay Gateway
# Letakkan di /etc/nginx/sites-available/qrispay.conf lalu symlink ke sites-enabled

server {
    listen 80;
    server_name bayar.domainanda.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bayar.domainanda.com;

    # SSL Certificates (Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/bayar.domainanda.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bayar.domainanda.com/privkey.pem;

    # OWASP Security Hardening Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 1M;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=qrispay_limit:10m rate=20r/s;

    location / {
        limit_req zone=qrispay_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
